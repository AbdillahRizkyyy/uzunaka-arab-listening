services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: istima
      POSTGRES_PASSWORD: istima
      POSTGRES_DB: istima
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istima"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres-data:
